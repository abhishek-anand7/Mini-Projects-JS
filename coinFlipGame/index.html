<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coin Flip Game</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <button class="player-move">Player</button>

    <button class="computer-move">Computer</button>

    <p class="result-para"></p>

    <div class="score-box">
      <p class="score-headline">Scores:-</p>

      <p class="tie-score">Tie: </p>

      <p class="player-score">Player: </p>

      <p class="computer-score">Computer: </p>
    </div>

    <button class="restart-btn">
      Restart
    </button>

    <script src="index.js"></script>
  </body>
</html>
