<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coin Flip Game</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <button class="player-move">Player</button>

    <button class="computer-move">Computer</button>

    <p class="result-para"></p>

    <div class="score-box">
      <p class="score-headline">Scores:-</p>

      <p class="score-para">Player: <span class="player-score"></span></p>

      <p class="score-para">Computer: <span class="player-score"></span></p>
    </div>
  </body>
</html>
