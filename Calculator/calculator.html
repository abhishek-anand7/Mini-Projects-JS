<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css" />
  </head>
  <body>
    <div class="container">
      <input class="display" />

      <section class="row-one">
        <button>%</button>
        <button>AC</button>
        <button>C</button>
        <button>&#9003;</button>
      </section>

      <section class="row-two">
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>&#247;</button>
      </section>

      <section class="row-three">
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>&#215;</button>
      </section>

      <section class="row-four">
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>&#8722;</button>
      </section>

      <section class="row-five">
        <button>0</button>
        <button>.</button>
        <button>=</button>
        <button>+</button>
      </section>
    </div>

    <!-- <script src="calculator.jsc"></script> -->
  </body>
</html>
